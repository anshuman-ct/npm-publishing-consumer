
name: Download Artifact Using GitHub App

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run ID from npm-publishing-demo"
        required: true
        type: string

permissions: {}

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: anshuman-ct
          repositories: npm-publishing-demo
          permission-actions: read

      - name: Download artifact from producer repository
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repository: anshuman-ct/npm-publishing-demo
          run-id: ${{ inputs.run_id }}
          path: downloaded-artifacts

      - name: Inspect downloaded artifact
        run: |
          echo "Downloaded files:"
          find downloaded-artifacts -type f

      - name: Verify npm package
        run: |
          PACKAGE=$(find downloaded-artifacts -name "*.tgz" -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "No npm package found!"
            exit 1
          fi

          echo "Package found: $PACKAGE"
          tar -tzf "$PACKAGE"
